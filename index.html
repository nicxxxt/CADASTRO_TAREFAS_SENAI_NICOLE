<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Fundo das Estrelas -->
  <div class="estrelas-fundo"></div>

  <!-- Cartão Principal -->
  <main class="cartao-aplicacao">
    <header class="cabecalho-aplicacao">
      <h1>Minhas Tarefas</h1>
      <button class="botao-icone" id="botao-tema" title="Alternar tema">🌙</button>
    </header>

    <div class="caixa-entrada">
      <input type="text" id="campo-tarefa" placeholder="Digite uma nova tarefa..." />
      <button class="botao-principal" id="botao-adicionar">Adicionar</button>
    </div>

    <!-- Lista de Tarefas -->
    <ul class="lista-tarefas" id="lista-tarefas">
      
      <!-- Card da Criadora DENTRO do quadrado de tarefas -->
      <li class="tarefa tarefa-criadora">
        <img src="foto.jpg" alt="Foto da Criadora" class="foto-criadora-lista" />
        <div class="texto-tarefa info-criadora-texto">
          <strong>Criadora do Código</strong>
          <span>Aluna do Curso de Desenvolvimento de Sistemas</span>
        </div>
      </li>

    </ul>

    <footer class="rodape-aplicacao">
      <span id="contador-tarefas">0 tarefas pendentes</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
